<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Usuarios')}"></head>
<body>
<div class="d-lg-flex">

    <aside th:replace="~{fragments/layout :: sidebar('usuarios')}"></aside>

    <main class="app-main">
        <header th:replace="~{fragments/layout :: topbar}"></header>

        <div class="p-3 p-lg-4">

            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                <h4 class="fw-bold mb-0">Usuarios</h4>
                <div th:replace="~{fragments/componentes :: botonesCrear}"></div>
            </div>

            <div class="sa-card p-3">

                <!-- Filtros + búsqueda -->
                <div class="row g-2 mb-3 align-items-center">
                    <div class="col-12 col-md-auto">
                        <div class="d-flex gap-2 overflow-auto">
                            <button type="button" class="btn btn-outline-secondary btn-sm text-nowrap" data-tipo-filtro="all">
                                Todos <span class="badge text-bg-dark" th:text="${#lists.size(listaCentrales) + #lists.size(listaDomiciliarios) + #lists.size(listaClientes)}">0</span></button>
                            <button type="button" class="btn btn-outline-secondary btn-sm text-nowrap" data-tipo-filtro="central">
                                Centrales <span class="badge text-bg-secondary" th:text="${#lists.size(listaCentrales)}">0</span></button>
                            <button type="button" class="btn btn-outline-secondary btn-sm text-nowrap" data-tipo-filtro="domiciliario">
                                Domiciliarios <span class="badge text-bg-secondary" th:text="${#lists.size(listaDomiciliarios)}">0</span></button>
                            <button type="button" class="btn btn-outline-secondary btn-sm text-nowrap" data-tipo-filtro="cliente">
                                Clientes <span class="badge text-bg-secondary" th:text="${#lists.size(listaClientes)}">0</span></button>
                        </div>
                    </div>
                    <div class="col-12 col-md">
                        <input id="buscarUsuario" type="search" class="form-control form-control-sm" placeholder="Buscar por nombre, cédula o teléfono...">
                    </div>
                </div>

                <table class="table table-hover align-middle mb-0 tabla-apilada">
                    <thead class="table-light small">
                        <tr>
                            <th>Tipo</th>
                            <th>Cédula</th>
                            <th>Nombre</th>
                            <th>Teléfono</th>
                            <th>Dirección</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Centrales -->
                        <tr th:each="c : ${listaCentrales}" class="fila-usuario" data-tipo="central"
                            th:attr="data-buscar=${#strings.toLowerCase(c.document + ' ' + c.name + ' ' + c.phone)}">
                            <td data-label="Tipo"><span class="badge text-bg-dark">🏢 Central</span></td>
                            <td data-label="Cédula" class="fw-semibold" th:text="${c.document}"></td>
                            <td data-label="Nombre" th:text="${c.name}"></td>
                            <td data-label="Teléfono" th:text="${c.phone}"></td>
                            <td data-label="Dirección" class="text-muted">—</td>
                            <td data-label="Estado">
                                <div class="form-check form-switch mb-0">
                                    <input class="form-check-input" type="checkbox" data-switch-estado data-api="/api/centrals"
                                           th:checked="${c.status.name() == 'ACTIVE'}" th:attr="data-doc=${c.document}">
                                    <label class="form-check-label small" th:text="${c.status.name() == 'ACTIVE' ? 'Activo' : 'Inactivo'}"></label>
                                </div>
                            </td>
                        </tr>

                        <!-- Domiciliarios -->
                        <tr th:each="d : ${listaDomiciliarios}" class="fila-usuario" data-tipo="domiciliario"
                            th:attr="data-buscar=${#strings.toLowerCase(d.document + ' ' + d.name + ' ' + d.phone)}">
                            <td data-label="Tipo"><span class="badge text-bg-primary">🛵 Domiciliario</span></td>
                            <td data-label="Cédula" class="fw-semibold" th:text="${d.document}"></td>
                            <td data-label="Nombre" th:text="${d.name}"></td>
                            <td data-label="Teléfono" th:text="${d.phone}"></td>
                            <td data-label="Dirección" class="text-muted">—</td>
                            <td data-label="Estado">
                                <div class="form-check form-switch mb-0">
                                    <input class="form-check-input" type="checkbox" data-switch-estado data-api="/api/couriers"
                                           th:checked="${d.status.name() == 'ACTIVE'}" th:attr="data-doc=${d.document}">
                                    <label class="form-check-label small" th:text="${d.status.name() == 'ACTIVE' ? 'Activo' : 'Inactivo'}"></label>
                                </div>
                            </td>
                        </tr>

                        <!-- Clientes -->
                        <tr th:each="cl : ${listaClientes}" class="fila-usuario" data-tipo="cliente"
                            th:attr="data-buscar=${#strings.toLowerCase(cl.document + ' ' + cl.name + ' ' + cl.phone + ' ' + cl.address)}">
                            <td data-label="Tipo"><span class="badge text-bg-success">👤 Cliente</span></td>
                            <td data-label="Cédula" class="fw-semibold" th:text="${cl.document}"></td>
                            <td data-label="Nombre" th:text="${cl.name}"></td>
                            <td data-label="Teléfono" th:text="${cl.phone}"></td>
                            <td data-label="Dirección" th:text="${cl.address}"></td>
                            <td data-label="Estado">
                                <div class="form-check form-switch mb-0">
                                    <input class="form-check-input" type="checkbox" data-switch-estado data-api="/api/clients"
                                           th:checked="${cl.status.name() == 'ACTIVE'}" th:attr="data-doc=${cl.document}">
                                    <label class="form-check-label small" th:text="${cl.status.name() == 'ACTIVE' ? 'Activo' : 'Inactivo'}"></label>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>

                <div id="sinUsuarios" class="d-none text-center text-muted small py-4">No hay usuarios que coincidan.</div>

                <div class="mt-3 small text-muted">
                    Los usuarios <strong>inactivos</strong> no aparecen para asignar ni para crear servicios.
                </div>
            </div>
        </div>
    </main>
</div>

<div th:replace="~{fragments/modales :: modalServicio}"></div>
<div th:replace="~{fragments/modales :: modalCliente}"></div>
<div th:replace="~{fragments/modales :: modalDomiciliario}"></div>
<div th:replace="~{fragments/modales :: modalCentral}"></div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
