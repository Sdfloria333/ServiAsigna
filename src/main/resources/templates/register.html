<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ServiAsigna - Registro de Actores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; min-height: 100vh; display: flex; align-items: center; }
        .reg-card { max-width: 500px; width: 100%; border: 1px solid #e2e8f0; border-radius: 10px; background: #fff; }
        .btn-dark-slate { background-color: #1e293b; color: #fff; }
    </style>
</head>
<body>
<div class="container d-flex justify-content-center">
    <div class="reg-card p-4 shadow-sm">
        <div class="text-center mb-3">
            <h4 class="fw-bold mb-0">ServiAsigna</h4>
            <p class="text-muted small mb-0">Registro Rápido de Actores en Red</p>
        </div>

        <ul class="nav nav-pills nav-fill mb-3 bg-light p-1 rounded" id="roleTabs">
            <li class="nav-item"><button class="nav-link active btn-sm" onclick="setRole('central', this)">Sede / Central</button></li>
            <li class="nav-item"><button class="nav-link btn-sm" onclick="setRole('courier', this)">Domiciliario</button></li>
            <li class="nav-item"><button class="nav-link btn-sm" onclick="setRole('client', this)">Cliente</button></li>
        </ul>

        <form id="regForm" onsubmit="registrarActor(event)">
            <input type="hidden" id="roleType" value="central">
            <div class="mb-2">
                <label class="form-label small fw-semibold">Cédula / Documento (Máx 20)</label>
                <input type="text" id="doc" class="form-control form-control-sm" maxlength="20" required>
            </div>
            <div class="mb-2">
                <label class="form-label small fw-semibold">Nombre (Máx 15 Central/Courier, 50 Cliente)</label>
                <input type="text" id="name" class="form-control form-control-sm" maxlength="15" required>
            </div>
            <div class="mb-2">
                <label class="form-label small fw-semibold">Teléfono (10 dígitos)</label>
                <input type="text" id="phone" class="form-control form-control-sm" maxlength="10" required>
            </div>
            <div class="mb-3 d-none" id="addressGroup">
                <label class="form-label small fw-semibold">Dirección de Entrega</label>
                <input type="text" id="address" class="form-control form-control-sm" maxlength="100">
            </div>
            <div class="mb-3">
                <span class="small fw-semibold me-2">Estado Inicial:</span>
                <span class="badge bg-success-subtle text-success">ACTIVE</span>
            </div>
            <button type="submit" class="btn btn-dark-slate w-100 py-2">Registrar en el Sistema</button>
        </form>
        <div class="text-center mt-3">
            <a href="/login" class="small text-secondary text-decoration-none">Volver al Login</a> |
            <a href="/dashboard" class="small text-secondary text-decoration-none">Ir al Dashboard</a>
        </div>
    </div>
</div>

<script>
    function setRole(role, btn) {
        document.querySelectorAll('#roleTabs .nav-link').forEach(el => el.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('roleType').value = role;
        const addrGroup = document.getElementById('addressGroup');
        const nameInput = document.getElementById('name');
        if (role === 'client') {
            addrGroup.classList.remove('d-none');
            nameInput.maxLength = 50;
        } else {
            addrGroup.classList.add('d-none');
            nameInput.maxLength = 15;
        }
    }

    async function registrarActor(e) {
        e.preventDefault();
        const role = document.getElementById('roleType').value;
        const payload = {
            document: document.getElementById('doc').value,
            name: document.getElementById('name').value,
            phone: document.getElementById('phone').value,
            status: 'ACTIVE'
        };
        let url = '/api/centrals';
        if (role === 'courier') url = '/api/couriers';
        if (role === 'client') {
            url = '/api/clients';
            payload.address = document.getElementById('address').value;
        }

        const res = await fetch(url, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });
        if (res.ok) {
            alert('Registrado correctamente');
            window.location.href = '/dashboard';
        } else {
            alert('Error al registrar. Verifica los datos o longitud.');
        }
    }
</script>
</body>
</html>
