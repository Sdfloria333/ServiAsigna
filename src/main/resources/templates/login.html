<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ServiAsigna - Login Operativo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }
        .login-card { max-width: 420px; width: 100%; border: 1px solid #e2e8f0; border-radius: 10px; background: #fff; }
        .btn-dark-slate { background-color: #1e293b; color: #fff; border: none; }
        .btn-dark-slate:hover { background-color: #0f172a; color: #fff; }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center flex-grow-1">
        <div class="login-card p-4 shadow-sm">
            <div class="text-center mb-4">
                <h4 class="fw-bold mb-0 text-dark">ServiAsigna</h4>
                <small class="text-muted">Control Operativo de Despacho</small>
            </div>
            <h6 class="fw-bold mb-3 text-center">Iniciar Turno Operativo</h6>
            <form action="/dashboard" method="get">
                <div class="row g-2 mb-3">
                    <div class="col-6">
                        <label class="form-label small fw-semibold">Cédula Operador</label>
                        <input type="text" class="form-control form-control-sm" placeholder="ej. 1024567890" required>
                    </div>
                    <div class="col-6">
                        <label class="form-label small fw-semibold">Sede Operativa</label>
                        <select class="form-select form-select-sm">
                            <option th:each="c : ${listaCentrales}" th:value="${c.document}" th:text="${c.name}"></option>
                            <option th:if="${#lists.isEmpty(listaCentrales)}">Sede Norte</option>
                        </select>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Contraseña / PIN</label>
                    <input type="password" class="form-control form-control-sm" placeholder="••••••••" required>
                </div>
                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" id="remember" checked>
                    <label class="form-check-label small text-muted" for="remember">Recordar en esta estación</label>
                </div>
                <button type="submit" class="btn btn-dark-slate w-100 py-2 fw-semibold">Iniciar Turno Operativo</button>
            </form>
            <div class="text-center mt-3">
                <a href="/register" class="small text-decoration-none text-secondary">¿Nuevo actor en red? Registrar aquí</a>
            </div>
        </div>
    </div>
    <footer class="p-2 px-3 bg-white border-top small text-muted">
        Servidor: En Línea | Oracle DB: Conectado
    </footer>
</body>
</html>
