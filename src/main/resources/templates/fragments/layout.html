<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<!-- ========== HEAD: se reutiliza en todas las páginas ========== -->
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'ServiAsigna · ' + ${titulo}">ServiAsigna</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>

<body>

<!-- ========== MENÚ LATERAL: solo Dashboard y Usuarios ========== -->
<aside th:fragment="sidebar" class="sidebar offcanvas-lg offcanvas-start d-flex flex-column" tabindex="-1" id="menu">
    <div class="offcanvas-header">
        <span class="brand"><span class="brand-mark"><i class="bi bi-bicycle"></i></span>ServiAsigna</span>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" data-bs-target="#menu"></button>
    </div>
    <div class="offcanvas-body d-flex flex-column flex-grow-1 justify-content-between p-3">
        <div>
            <div class="brand mb-4 px-2 d-none d-lg-flex"><span class="brand-mark"><i class="bi bi-bicycle"></i></span>ServiAsigna</div>
            <nav class="nav flex-column gap-1">
                <a class="nav-link" data-vista="dashboard" href="#dashboard"><i class="bi bi-speedometer2"></i> Dashboard <span id="navPend" class="badge text-bg-warning ms-auto d-none" title="Servicios sin asignar">0</span></a>
                <a class="nav-link" data-vista="usuarios" href="#usuarios"><i class="bi bi-people"></i> Usuarios</a>
            </nav>
        </div>
        <a class="nav-link text-danger small mt-4" href="/login"><i class="bi bi-box-arrow-left"></i> Cerrar turno</a>
    </div>
</aside>

<!-- ========== BARRA SUPERIOR: solo se ve en celular ========== -->
<header th:fragment="topbar" class="topbar d-lg-none d-flex align-items-center gap-3 px-3 py-2">
    <button class="btn btn-outline-light btn-sm" type="button" data-bs-toggle="offcanvas" data-bs-target="#menu" aria-label="Abrir menú">☰</button>
    <span class="brand"><span class="brand-mark"><i class="bi bi-bicycle"></i></span>ServiAsigna</span>
</header>

<!-- ========== SCRIPTS + contenedor de avisos ========== -->
<th:block th:fragment="scripts">
    <div id="toasts" class="toast-container position-fixed bottom-0 end-0 p-3" aria-live="polite"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
    <script th:src="@{/js/app.js}"></script>
</th:block>

</body>
</html>
